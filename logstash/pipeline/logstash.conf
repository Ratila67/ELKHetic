input {
  file {
    path => "/data/movies.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => plain { charset => "UTF-8" }
  }
}

filter {
  csv {
    separator => ","
    quote_char => '"'
    columns => [
      "id", "title", "genres", "original_language", "overview",
      "popularity", "production_companies", "release_date", "budget",
      "revenue", "runtime", "status", "tagline", "vote_average",
      "vote_count", "credits", "keywords", "poster_path",
      "backdrop_path", "recommendations"
    ]
  }

  # Supprime la ligne de header
  if [id] == "id" {
    drop {}
  }

  # Supprime les champs internes Logstash
  mutate {
    remove_field => ["@version", "host", "log", "message", "event"]
  }

  # -------------------------------------------------------------------------
  # F3-03 — Gestion des valeurs manquantes et anomalies
  # -------------------------------------------------------------------------

  # 1. Typage numérique — conversion avant les contrôles
  mutate {
    convert => {
      "budget"        => "float"
      "revenue"       => "float"
      "runtime"       => "float"
      "vote_average"  => "float"
      "vote_count"    => "integer"
      "popularity"    => "float"
    }
  }

  # 2. Films sans titre — drop immédiat, inutilisable
  if ![title] or [title] == "" {
    mutate { add_tag => ["_data_quality", "missing_title"] }
    drop {}
  }

  # 3. Budget à 0 ou manquant — valeur sentinelle -1
  if ![budget] or [budget] == 0 {
    mutate {
      replace     => { "budget" => -1 }
      add_tag     => ["_data_quality", "missing_budget"]
    }
  }

  # 4. Revenue à 0 ou manquant — valeur sentinelle -1
  if ![revenue] or [revenue] == 0 {
    mutate {
      replace     => { "revenue" => -1 }
      add_tag     => ["_data_quality", "missing_revenue"]
    }
  }

  # 5. vote_average hors plage [0, 10]
  if [vote_average] and ([vote_average] < 0 or [vote_average] > 10) {
    mutate {
      replace => { "vote_average" => -1 }
      add_tag => ["_data_quality", "invalid_vote_average"]
    }
  }

  # 6. runtime négatif ou nul — incohérent
  if ![runtime] or [runtime] <= 0 {
    mutate {
      replace => { "runtime" => -1 }
      add_tag => ["_data_quality", "missing_runtime"]
    }
  }

  # 7. popularity négative — impossible
  if [popularity] and [popularity] < 0 {
    mutate {
      replace => { "popularity" => -1 }
      add_tag => ["_data_quality", "invalid_popularity"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "movies_raw"
  }
  # Décommenter pour debug local
  # stdout { codec => rubydebug }
}